services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: world
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d world"]
      interval: 5s
      timeout: 5s
      retries: 20

  etl:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      # inside compose, reach postgres by service name
      POSTGRES_HOST: postgres
    volumes:
      # allow editing source and using local data without rebuilding image
      - ../src:/app/src
      - ../data:/app/data
    working_dir: /app
    command: ["python", "-m", "src.entrypoints.cli", "--help"]

volumes:
  postgres_data:

