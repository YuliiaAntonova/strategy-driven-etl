[project]
name = "solid-etl-refactor-template"
version = "0.2.0"
description = "Refactored ETL template"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.0",
  "python-jobspy>=1.1.80",
  "snowflake-sqlalchemy>=1.5.0",
  "snowflake-connector-python>=3.0.0",
]

[project.optional-dependencies]
dev = ["vulture>=2.14"]
bigquery = [
  "google-cloud-bigquery>=3.14.0",
  "sqlalchemy-bigquery>=1.10.0",
  "pyarrow>=14.0.0",
]

[tool.vulture]
paths = ["src"]
min_confidence = 70
exclude = ["**/sdk/decorators.py"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"