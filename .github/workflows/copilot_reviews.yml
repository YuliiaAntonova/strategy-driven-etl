            - name: copilot-code-review
  # You may pin to the exact commit or the version.
  # uses: AllyW/copilot-pr-review@648cdcc2c58721a1341d2c3bf6bdd6cc258ccbf5
  uses: AllyW/copilot-pr-review@v0.1.34
  with:
    # Token for using GitHub REST API
    AUTH_TOKEN: # optional, default is ${{ github.token }}
    # Pull PR_EVENT
    PR_EVENT: # optional
    # APIKEY
    APIKEY:
    # ENDPOINT
    ENDPOINT:
    # Whether review pr code change by patch
    code_suggest: # optional
    # Whether draw a conclusion from whole pr diff
    pr_summary: # optional
    # Whether clean last round pr reviews
    pr_reset: # optional
    # Whether filter review result by evaluation
    review_filter: # optional
