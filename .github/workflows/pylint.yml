name: Python CI

on:
  push:
    branches: [devel]
  pull_request:
    branches: [devel]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pandas sqlalchemy psycopg2-binary python-dotenv python-jobspy pylint

      - name: Compile source
        run: python -m compileall src

      - name: Import smoke check
        run: |
          python -c "import src.entrypoints.cli"
          python -c "import pandas, sqlalchemy, dotenv"

      - name: Run pylint
        run: pylint src